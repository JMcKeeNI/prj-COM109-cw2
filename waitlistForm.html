<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dripfast Waitlist Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css"></link>
    <link href='https://fonts.googleapis.com/css?family=Roboto Mono' rel='stylesheet'>
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/waitlistValidation.js"></script>
</head>
<body>
    <nav>
        <header>Dripfast</header>
        <div class="links">    
            <a href="@" class="nav-link">About</a>
            <a href="@" class="nav-link active">Upcoming Drops</a>
            <a href="@" class="nav-link">Previous Drops</a>            
        </div>
        <a href="@">Cart (0)</a>
    </nav>
    <div></div>
    <hr>

     <form id="waitlistForm" action="">
        <div class="formContainer">
            <h1 style="margin:5px;">Sign Up to the Waitlist</h1>
            <p><input class="formInput" type=text" placeholder = "First Name..." id="fName"></p>
            <p><input class="formInput" type=text" placeholder = "Last Name..." id="sName"></p>
            <p><input class="formInput" type=text" placeholder = "Email..." id="email"></p>
            <p><input class="formInput" type=text" placeholder = "Phone Number..." id="phone" ></p>
            <button class= "submitButton" type="button" id="submit">Sign Up</button>
        </div>
    </form>
    <div class="containerInfoBox">
        <div class="infoBox">Be the first to know when new collections drop</div>
        <div class="infoBox">Support our Local Brand and emerging ideas</div>
        <div class="infoBox">Restock Notifications - Know when your favoutite items return</div>
    </div>
</body>
</html>
