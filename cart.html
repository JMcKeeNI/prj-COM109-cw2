<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dripfast</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"></link>
    <link rel="stylesheet" href="css/config.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <header>Dripfast</header>
        </div>
        <div class="links nav-center">
            <a href="index.html" class="nav-link">About</a>
            <a href="items.html" class="nav-link">Upcoming Drops</a>
            <a href="cart.html" class="nav-link">Previous Drops</a>            
        </div>
        <div class="nav-right">
            <a href="cart.html" class="nav-link active" id="cart">Cart ()</a>
        </div>
    </nav>
    <div class="row">
        <div class="col-md-8">
          <div class="card mb-4">
            <div class="card-header py-3">
              <h5 class="mb-0">Cart</h5>
            </div>
            <div class="card-body">
              <!-- Single item -->
              <div class="row">
                <div class="col-lg-3 col-md-12 mb-4 mb-lg-0">
                  <div class="bg-image hover-overlay hover-zoom ripple rounded" data-mdb-ripple-color="light">
                    <img src="img/hoodie2.jpg" class="w-100">
                  </div>
                </div>
                <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
                  <p><strong>GREENIE</strong></p>
                </div>
                <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                  <p class="text-start text-md-center">
                    $17.99
                  </p>
                </div>
              </div>
              <!-- Single item -->
              <hr class="my-4">
              
              <div class="row">
                <div class="col-lg-3 col-md-12 mb-4 mb-lg-0">
                  <div class="bg-image hover-overlay hover-zoom ripple rounded" data-mdb-ripple-color="light">
                    <img src="img/hoodie2.jpg" class="w-100">
                  </div>
                </div>
                <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
                  <p><strong>GREENIE</strong></p>
                </div>
                <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                  <p class="text-start text-md-center">
                    $17.99
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card mb-4">
            <div class="card-header py-3">
              <h5 class="mb-0">Summary</h5>
            </div>
            <div class="card-body">
              <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 pb-0">
                  Products
                  <span>$53.98</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                  Shipping
                  <span>Gratis</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 mb-3">
                  <div>
                    <strong>Total amount</strong>
                    <strong>
                      <p class="mb-0">(including VAT)</p>
                    </strong>
                  </div>
                  <span><strong>$53.98</strong></span>
                </li>
              </ul>

              <button type="button" data-mdb-button-init="" data-mdb-ripple-init="" class="btn btn-primary btn-lg btn-block" data-mdb-button-initialized="true">
                Go to checkout
              </button>
            </div>
          </div>
        </div>
      </div>

    
    <div></div>
    <script src="js/basket.js"></script>
    <script src="js/loadCart.js"></script>
</body>
</html>
